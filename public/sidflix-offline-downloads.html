<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><title>Downloads · Sidflix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a10;color:#fff;font:15px system-ui,sans-serif}header{padding:25px max(22px,5vw);border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}header img{width:140px;height:46px;object-fit:contain}a{color:#a5e3ff}main{max-width:1100px;padding:42px 24px 80px;margin:auto}.eyebrow{font-size:10px;letter-spacing:.22em;color:#86d7fd}h1{font-size:clamp(36px,6vw,62px);line-height:1.06;letter-spacing:-.05em;font-weight:650;margin:15px 0}h1 span{color:#8bdafa}.hint{color:#92a4bb;line-height:1.8;font-size:13px}#saved{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:30px}.card{border:1px solid #9bd6f322;border-radius:17px;overflow:hidden;background:#121b28}.cover{position:relative;aspect-ratio:2;background:linear-gradient(130deg,#284760,#121f32)}.cover img{width:100%;height:100%;object-fit:cover}.copy{padding:22px}.copy h2{margin:0;font-size:22px;letter-spacing:-.03em}.copy p{font-size:12px;color:#91a6be}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button{border:1px solid #ffffff20;background:#ffffff08;color:#b9d0e8;padding:11px 15px;border-radius:9px;cursor:pointer}.primary{background:#85d7fb;color:#071722;font-weight:650;border:0}button:focus-visible,a:focus-visible{outline:3px solid #a5e3ff;outline-offset:3px}.empty{border:1px solid #ffffff15;background:#101824;border-radius:16px;padding:28px;margin-top:30px;color:#aabed4;line-height:1.8}#player{position:fixed;inset:0;background:#000;z-index:5}#player[hidden]{display:none}video{width:100%;height:100%;object-fit:contain}.exit-zone{position:absolute;right:0;top:0;padding:16px;z-index:2}.exit-zone button{opacity:0;background:#101722de}.exit-zone:hover button,.exit-zone:focus-within button{opacity:1}.error{color:#f4b7bf;padding:15px;border:1px solid #e86d7b44;border-radius:9px}footer{padding:20px 0;color:#6f829b;font-size:11px}@media(max-width:650px){#saved{grid-template-columns:1fr}header{padding:18px 22px}header img{width:120px}}
</style></head><body><header><img src="/brand/sidflix-greek-sky.png" alt="Sidflix"><span class="hint">Saved on this device</span></header><main><p class="eyebrow">SIDFLIX, TO GO</p><h1>A story is always<br><span>close by.</span></h1><p id="greeting" class="hint">Your saved films are ready, even without a connection.</p><div id="notice" role="status"></div><ul id="saved"></ul><footer>Saved films stay on this device. <a href="/downloads">Reconnect to browse downloads</a>.</footer></main><div id="player" hidden><div class="exit-zone"><button id="close" aria-label="Exit fullscreen">Exit fullscreen</button></div><video controls playsinline aria-label="Saved film"></video></div>
<script>
"use strict";
let database, objectURL;const list=document.querySelector('#saved'),notice=document.querySelector('#notice'),player=document.querySelector('#player'),video=player.querySelector('video');
const size=n=>n>=1e9?(n/1e9).toFixed(1)+' GB':(n/1e6).toFixed(1)+' MB';
function say(text){notice.className='empty';notice.textContent=text;}
function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('sidflix-downloads-v1',1);request.onupgradeneeded=()=>{const db=request.result;const jobs=db.createObjectStore('jobs',{keyPath:'key'});jobs.createIndex('account','accountId');const chunks=db.createObjectStore('chunks',{keyPath:['key','offset']});chunks.createIndex('job','key')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
function read(store,index,key){return new Promise((resolve,reject)=>{const request=database.transaction(store).objectStore(store).index(index).getAll(key);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function blob(job){const chunks=(await read('chunks','job',job.key)).sort((a,b)=>a.offset-b.offset);let offset=0;for(const chunk of chunks){if(chunk.offset!==offset)throw Error('incomplete');offset+=chunk.data.size}if(offset!==job.bytes)throw Error('incomplete');return new Blob(chunks.map(chunk=>chunk.data),{type:job.mime})}
function closePlayer(){video.pause();video.removeAttribute('src');video.load();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=null;player.hidden=true;if(document.fullscreenElement===player)document.exitFullscreen().catch(()=>{})}
document.querySelector('#close').onclick=closePlayer;
async function watch(job){try{player.hidden=false;player.requestFullscreen?.().catch(()=>{});objectURL=URL.createObjectURL(await blob(job));video.src=objectURL;video.focus();await video.play().catch(()=>{})}catch{closePlayer();say('This saved film couldn’t open. Reconnect and download it again.')}}
async function save(job){try{const url=URL.createObjectURL(await blob(job)),a=document.createElement('a');a.href=url;a.download=(job.title+' '+job.quality).replace(/[\x00-\x1f/\\:*?"<>|]/g,' ').slice(0,110)+(job.mime==='video/webm'?'.webm':'.mp4');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch{say('This saved film couldn’t open. Reconnect and download it again.')}}
async function remove(job,card){try{await new Promise((resolve,reject)=>{const tx=database.transaction(['jobs','chunks'],'readwrite');tx.objectStore('jobs').delete(job.key);const request=tx.objectStore('chunks').index('job').openCursor(IDBKeyRange.only(job.key));request.onsuccess=()=>{const cursor=request.result;if(cursor){cursor.delete();cursor.continue()}};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});card.remove();if(!list.children.length)say('No films are saved on this device. Reconnect to choose a download.')}catch{say('The saved film couldn’t be removed. Please try again.')}}
function button(text,action,primary=false){const b=document.createElement('button');b.textContent=text;if(primary)b.className='primary';b.onclick=action;return b}
async function start(){try{const viewer=JSON.parse(localStorage.getItem('sidflix:downloads:viewer')||'null');if(!viewer?.id){say('Sign in while online to return to your saved films.');return}database=await openDB();const jobs=(await read('jobs','account',viewer.id)).filter(job=>job.status==='completed').sort((a,b)=>b.createdAt-a.createdAt);document.querySelector('#greeting').textContent=viewer.name+', your saved films are ready without a connection.';for(const job of jobs){const card=document.createElement('li');card.className='card';const cover=document.createElement('div');cover.className='cover';if(/^\/media-downloads\/[a-z0-9-]+\.jpg$/.test(job.poster)){const img=document.createElement('img');img.src=job.poster;img.alt='';cover.append(img)}const copy=document.createElement('div');copy.className='copy';const title=document.createElement('h2');title.textContent=job.title;const meta=document.createElement('p');meta.textContent=job.quality+' · '+size(job.bytes);const actions=document.createElement('div');actions.className='actions';actions.append(button('▶ Watch offline',()=>watch(job),true),button('Save video file',()=>save(job)),button('Remove',()=>remove(job,card)));copy.append(title,meta,actions);card.append(cover,copy);list.append(card)}if(!jobs.length)say('No films are saved on this device. Reconnect to choose a download.')}catch{say('Saved films couldn’t open in this browser. Your exported video files are still in your device’s Downloads folder.')}}
document.addEventListener('keydown',event=>{if(['Escape','BrowserBack','GoBack','Backspace'].includes(event.key)||[4,461,10009].includes(event.keyCode)){if(!player.hidden){event.preventDefault();closePlayer()}return}if(!event.key.startsWith('Arrow')||!player.hidden)return;const buttons=[...document.querySelectorAll('main button,main a')].filter(b=>b.getClientRects().length);const index=buttons.indexOf(document.activeElement);let next=index<0?0:index;if(index>=0){const r=buttons[index].getBoundingClientRect();let score=Infinity;buttons.forEach((b,i)=>{if(i===index)return;const t=b.getBoundingClientRect(),dx=t.x+t.width/2-r.x-r.width/2,dy=t.y+t.height/2-r.y-r.height/2,d=event.key==='ArrowRight'?dx:event.key==='ArrowLeft'?-dx:event.key==='ArrowDown'?dy:-dy,cross=Math.abs(event.key==='ArrowLeft'||event.key==='ArrowRight'?dy:dx);if(d>2&&d+cross*3<score){score=d+cross*3;next=i}})}if(buttons[next]){event.preventDefault();buttons[next].focus();buttons[next].scrollIntoView({block:'nearest'})}});
start();
</script></body></html>
